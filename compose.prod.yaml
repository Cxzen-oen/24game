# 生产部署：Caddy（HTTPS） + Spring Boot + PostgreSQL，全部在 Docker 内网
# 默认按 2 核 2G 小规模测试调优；4G 以上可放宽 mem_limit 与 JVM 堆。
# 使用：docker compose --env-file .env.prod -f compose.prod.yaml up -d --build
name: game24

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    # 2G 内存下的保守参数：shared_buffers 128MB，连接数上限 40
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - wal_compression=on
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不映射宿主机端口：数据库只在 compose 内网可达
    shm_size: 128mb
    mem_limit: ${DB_MEM_LIMIT:-640m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  app:
    build:
      context: .
      # 2C2G 推荐用预构建 jar 的 runtime Dockerfile；4G 以上可改回 Dockerfile 全量构建
      dockerfile: ${APP_DOCKERFILE:-Dockerfile}
    image: game24-app:${APP_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_SIZE: "8"
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FORWARD_HEADERS_STRATEGY: framework
      SERVER_PORT: "8080"
      TZ: UTC
      # 2G 机器：堆 512MB + Metaspace 160MB，SerialGC 降低占用
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC}
    expose:
      - "8080"
    mem_limit: ${APP_MEM_LIMIT:-900m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    mem_limit: ${PROXY_MEM_LIMIT:-96m}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
